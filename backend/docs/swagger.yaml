openapi: 3.0.3
info:
  title: API Manajemen Event & Tiket Digital
  description: Dokumentasi resmi OpenAPI / Swagger 3.0 untuk Sistem Manajemen Event & Tiket Digital (Modul Autentikasi & Management Role).
  version: 1.0.0
  contact:
    name: Tim Engineering
    email: dev@eventticket.com

servers:
  - url: http://localhost:3000/api/v1
    description: Server Lokal (Development)

tags:
  - name: Authentication
    description: Endpoint untuk Registrasi, Login, Profile Check (/me), Refresh Token, dan Logout.

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register User Baru
      description: Pendaftaran akun baru untuk publik. Secara default role otomatis diset sebagai ATTENDEE (User Reguler).
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Registrasi akun berhasil
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/UserResponse'
        '400':
          description: Request Body / Validasi tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login Akun
      description: Autentikasi user menggunakan email dan password untuk mendapatkan Access Token dan Refresh Token.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login berhasil
                  data:
                    type: object
                    properties:
                      tokens:
                        $ref: '#/components/schemas/TokenResponse'
                      user:
                        $ref: '#/components/schemas/UserResponse'
        '401':
          description: Email atau password salah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get Profile User (Protected)
      description: Mengambil data profil user yang sedang login berdasarkan Access Token JWT.
      operationId: getProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profil berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Profil berhasil diambil
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/UserResponse'
        '401':
          description: Access Token tidak valid atau kadaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh Access Token
      description: Memperbarui Access Token yang kadaluwarsa dengan mengirimkan Refresh Token.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200':
          description: Access Token berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Token berhasil diperbarui
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      expiresIn:
                        type: string
                        example: 15m
        '401':
          description: Refresh Token tidak valid atau sudah dicabut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout User
      description: Mencabut (revoke) Refresh Token sehingga tidak dapat digunakan kembali.
      operationId: logoutUser
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logout berhasil

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Masukkan Access Token JWT (Contoh: Bearer eyJhbGciOi...)

  schemas:
    RegisterInput:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: budi@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: Password123!

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: budi@example.com
        password:
          type: string
          format: password
          example: Password123!

    RefreshInput:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: d8f9a2b1c3e4567890abcdef...

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: c1f7a2d0-8e12-4a5b-9c3d-123456789abc
        name:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: budi@example.com
        role:
          type: string
          enum: [ATTENDEE, ORGANIZER, ADMIN]
          example: ATTENDEE
        isVerified:
          type: boolean
          example: false
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: 2026-09-23T17:00:00.000Z

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: d8f9a2b1c3e4567890abcdef...
        expiresIn:
          type: string
          example: 15m

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Deskripsi pesan kesalahan
